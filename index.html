<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>IngatRX</title>

    <!-- <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" id="favicon"/> -->

    <link rel="stylesheet" href="src/style.css" />
</head>
<body>
    <header>
        IngatRX
    </header>

    <main>
        <section>
            <h2>Drug name search</h2>
            <div class="searchrow">
                <input type="text" id="q" placeholder="Enter your proposed drug name…" aria-label="Proposed drug name" autocomplete="off">
                <button id="go">Search</button>
            </div>
            <div class="results">
            <table>
                <thead>
                    <tr>
                        <th>Drug names</th>
                        <th>Similarity score</th>
                        <th>Source/s</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
            <div class="empty" id="empty">Enter a proposed name and click Search to compare it against existing drugs.</div>
            </div>
        </section>
        <aside>
            <h2>Customize search</h2>
            <fieldset>
                <legend>Search type</legend>
                <label><input type="radio" name="type" value="name" checked> Name search</label>
                <label><input type="radio" name="type" value="direct"> Direct search</label>
                <label><input type="radio" name="type" value="stem"> USAN stem search</label>
            </fieldset>
            <fieldset>
                <legend>Data source</legend>
                <label><input type="checkbox" name="src" value="Philippine FDA" checked> Philippine FDA</label>
                <label><input type="checkbox" name="src" value="U.S. FDA" checked> U.S. FDA</label>
                <label><input type="checkbox" name="src" value="INN LASA List" checked> INN LASA List</label>
            </fieldset>
            <fieldset>
                <legend>Scoring algorithms</legend>
                <label><input type="checkbox" name="alg" value="bi" checked> Bi-SIM</label>
                <label><input type="checkbox" name="alg" value="tri" checked> Tri-SIM</label>
                <label><input type="checkbox" name="alg" value="aline" checked> ALINE</label>
                <label><input type="checkbox" name="alg" value="editex" checked> EDITEX</label>
            </fieldset>
            <p class="note">Disclaimer: Mock website not indicative of final product :P</p>
        </aside>
    </main>
</body>
