    "catboost>=1.2.10",
    "fastapi>=0.156.8",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "uvicorn>=0.54.0",
]
